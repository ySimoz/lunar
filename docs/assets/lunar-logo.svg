<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="920" height="220" role="img" aria-labelledby="lunar-hero-title">
  <title id="lunar-hero-title">Lunar — A macOS-first study workspace for flashcards and math</title>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="920" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171B22" />
      <stop offset="100%" stop-color="#0E1117" />
    </linearGradient>
    <linearGradient id="bannerRim" x1="460" y1="0" x2="460" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="squircleBg" x1="110" y1="38" x2="110" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#222A36" />
      <stop offset="100%" stop-color="#131720" />
    </linearGradient>
    <linearGradient id="frontCardBg" x1="60" y1="70" x2="160" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#323C4B" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#1A202B" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="silverMoon" x1="86" y1="142" x2="140" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="55%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="916" height="216" rx="24" fill="url(#bannerBg)" stroke="url(#bannerRim)" stroke-width="1.5" />

  <!-- App emblem -->
  <g transform="translate(38, 38)">
    <rect x="0" y="0" width="144" height="144" rx="34" fill="url(#squircleBg)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2" />
    <rect x="32" y="20" width="80" height="86" rx="8" fill="#1B222D" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
    <rect x="22" y="30" width="100" height="94" rx="11" fill="url(#frontCardBg)" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1.2" />
    <path d="M 67.8 46.5 A 28 28 0 1 0 101.4 80.1 A 23.8 23.8 0 0 1 67.8 46.5 Z" fill="url(#silverMoon)" />
  </g>

  <!-- Wordmark and summary -->
  <text x="218" y="96" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="600" letter-spacing="-0.8">Lunar</text>
  <text x="220" y="138" fill="#B4BCC8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400">A macOS-first study workspace for flashcards and math.</text>

  <!-- Version & platform pills -->
  <g transform="translate(220, 158)">
    <rect x="0" y="0" width="76" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <text x="38" y="17" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500">v0.1.0</text>

    <rect x="88" y="0" width="112" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <text x="144" y="17" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">macOS 14+</text>

    <rect x="212" y="0" width="136" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <text x="280" y="17" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">SwiftUI + Go</text>
  </g>
</svg>
