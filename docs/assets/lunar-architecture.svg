<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Lunar Two-Process Desktop Architecture</title>
  <desc id="arch-desc">SwiftUI desktop app communicating over localhost HTTP JSON with the lunar-core Go daemon and SQLite stores.</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0D1016"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="436" rx="24" fill="url(#archBg)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Left container: SwiftUI macOS App -->
  <g transform="translate(48 48)">
    <rect x="0" y="0" width="460" height="344" rx="18" fill="#1B212C" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>
    <text x="24" y="42" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">Lunar.app</text>
    <text x="24" y="70" fill="#9CA6B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Swift 6 · SwiftUI · AppKit (macOS 14+)</text>

    <rect x="22" y="96" width="416" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <text x="38" y="124" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Study Workspace &amp; ViewModels</text>
    <text x="38" y="148" fill="#9CA6B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Today, Library, Deck, Gauntlet, Pomodoro</text>

    <rect x="22" y="176" width="416" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <text x="38" y="204" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Offline KaTeX Renderer</text>
    <text x="38" y="228" fill="#9CA6B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Pre-warmed WKWebView · KaTeX 0.19.0</text>

    <rect x="22" y="256" width="416" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <text x="38" y="284" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">2D Grapher &amp; Symbolic CAS</text>
    <text x="38" y="308" fill="#9CA6B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Implicit contours · diff / integrate / solve</text>
  </g>

  <!-- Loopback IPC Bridge with explicit vector arrowheads -->
  <g transform="translate(520 166)">
    <line x1="4" y1="36" x2="170" y2="36" stroke="#CBD5E1" stroke-width="2"/>
    <polygon points="170,30 182,36 170,42" fill="#CBD5E1"/>

    <line x1="16" y1="86" x2="182" y2="86" stroke="#9CA6B5" stroke-width="2" stroke-dasharray="5 5"/>
    <polygon points="16,80 4,86 16,92" fill="#9CA6B5"/>

    <text x="93" y="22" text-anchor="middle" fill="#F4F4F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">127.0.0.1:0</text>
    <text x="93" y="68" text-anchor="middle" fill="#9CA6B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">JSON REST API</text>
    <text x="93" y="114" text-anchor="middle" fill="#9CA6B5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">LUNAR_CORE_ADDR</text>
  </g>

  <!-- Right column: Go core + SQLite databases -->
  <g transform="translate(714 48)">
    <rect x="0" y="0" width="438" height="196" rx="18" fill="#1B212C" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>
    <text x="24" y="42" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">lunar-core Daemon</text>
    <text x="24" y="70" fill="#9CA6B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Go 1.24 · net/http ServeMux · child process</text>

    <rect x="22" y="92" width="188" height="80" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <text x="36" y="124" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">SM-2 &amp; Stats</text>
    <text x="36" y="150" fill="#9CA6B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Reviews &amp; mastery</text>

    <rect x="226" y="92" width="190" height="80" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <text x="240" y="124" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Import / Export</text>
    <text x="240" y="150" fill="#9CA6B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">JSON · MD · TSV</text>

    <!-- Down arrow to SQLite -->
    <line x1="219" y1="198" x2="219" y2="232" stroke="#CBD5E1" stroke-width="2"/>
    <polygon points="213,230 219,242 225,230" fill="#CBD5E1"/>

    <!-- SQLite Storage Box -->
    <rect x="0" y="244" width="438" height="100" rx="18" fill="#151A23" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.2"/>
    <text x="24" y="280" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">SQLite Persistence (go-sqlite3)</text>
    <text x="24" y="308" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Release: Lunar/lunar.db</text>
    <text x="24" y="332" fill="#9CA6B5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Debug:   Lunar-Debug/lunar.db</text>
  </g>
</svg>
